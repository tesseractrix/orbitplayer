<!DOCTYPE html>
<html lang="en">

<head>
    <title>Orbit Player</title>
    <linkrbit_ico_blue.png
    <link rel="stylesheeteta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <!-- LOGIN -->

    <div id="login-area">

        <p align="center">
            bit_white.png" width="140" height="50">
        </p>

        <p align="center">
            <input
                type="email"
                id="email"
                placeholder="E-mail">
        </p>

        <p align="center">
            <input
                type="password"
                id="senha"
                placeholder="Senha">
        </p>

        <p align="center">
            <button onclick="login()">Entrar</button>
        </p>

    </div>

    <!-- PLAYER -->

    <div id="player-area" style="display:none;">

        <header>

            <p>
                <a href="start.html">
                    _white.png" width="140" height="50">
                </a>
            </p>

            <p>
                .html">Explore</a> •
                ">Updates</a>
            </p>

        </header>

        <main>

            <p align="center">
                <input
                    type="text"
                    id="search"
                    onkeyup="search()"
                    placeholder="Search music...">
            </p>

            <ul id="results"></ul>

        </main>

        <footer>

            <div class="control-box">
                <button id="repeatButton">Repeat Off</button>
                <button onclick="prevSong()">Prev</button>
                <button onclick="skipSong()">Skip</button>
            </div>

            <p id="tituloMusica"></p>

            <audio
                id="audioPlayer"
                controls
                preload="auto"
                playsinline
                webkit-playsinline>

                

            </audio>

        </footer>

    </div>

    <script>

        var data = [];

        fetch('music_map.txt')
            .then(response => response.json())
            .then(json => {

                data = json;

                console.log("Músicas carregadas:", data);

                renderList();
                playRandom();

            })
            .catch(error => console.error("Erro:", error));

    </script>
