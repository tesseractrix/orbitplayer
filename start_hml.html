<!DOCTYPE html>
<html lang="en">

<head>
    <title>Orbit Player</title>
    <link rel="icon" href="img/orbit_ico_blue.png">
    <link rel="stylesheet" href="css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- LOGIN -->
    
<div id="login-area">
    <p align="center">
        <img src="img/orbit_white.png" width="140" height="50">
    </p>

    <p align="center">
        <input type="email" id="email" placeholder="E-mail">
    </p>

    <p align="center">
        <input type="password" id="senha" placeholder="Senha">
    </p>

    <p align="center">
        <button onclick="login()">Entrar</button>
    </p>

    <!-- NOVOS LINKS DE SUPORTE -->
    <p align="center" style="font-size: 14px; margin-top: 15px;">
        <a href="#" onclick="showRegisterModal(event)" style="color: #fff; text-decoration: underline;">Cadastrar-se</a> • 
        <a href="#" onclick="forgotPassword(event)" style="color: #ccc; text-decoration: underline;">Esqueci a senha</a>
    </p>
</div>
    
    <!-- PLAYER -->
    <div id="player-area" style="display:none;">

        <header>
            <p>
                <a href="start.html">
                    <img src="img/orbit_white.png" width="140" height="50">
                </a>
            </p>

            <p>
                <a href="explore.html">Explore</a> •
                <a href="news.html">Updates</a>
            </p>
        </header>

        <main>

            <p align="center">
                <input
                    type="text"
                    id="search"
                    onkeyup="search()"
                    placeholder="Search music...">
            </p>

            <ul id="results"></ul>

        </main>

        <footer>

            <div class="control-box">
                <button id="repeatButton">Repeat Off</button>
                <button onclick="prevSong()">Prev</button>
                <button onclick="skipSong()">Skip</button>
            </div>

            <p id="tituloMusica"></p>

            <audio
                id="audioPlayer"
                controls
                preload="auto"
                playsinline
                webkit-playsinline>
            </audio>

        </footer>

    </div>

    <script>
        var data = [];

        fetch('music_map.txt')
            .then(response => response.json())
            .then(json => {

                data = json;

                console.log("Músicas carregadas:", data);

                renderList();
                playRandom();

            })
            .catch(error => console.error("Erro:", error));
    </script>

    <!-- SCRIPT DO PLAYER -->
    <script src="js/script.js"></script>

    <!-- LOGIN FIREBASE -->
    <script type="module" src="js/login.js"></script>

</body>
</html>
