<!DOCTYPE html>
<html lang="en">

<head>
    <title>Orbit Player</title>

    <link rel="icon" hrefg
    <link rel="css

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <!-- LOGIN -->
    <div id="login-area">

        <p align="center">
            <img src="img/orpng
        </p>

        <p align="center">
            <input
                type="email"
                id="email"
                placeholder="E-mail">
        </p>

        <p align="center">
            <input
                type="password"
                id="senha"
                placeholder="Senha">
        </p>

        <p align="center">
            <button onclick="login()">Entrar</button>
        </p>

    </div>

    <!-- PLAYER -->
    <div id="player-area" style="display:none;">

        <header>

            <p>
                <a href="start.html">
                    img/orbit_white.png
                </a>
            </p>

            <p>
                <a href="explore.html">Explore</a> •
                <a href="news.html">Updates</a>
            </p>

        </header>

        <main>

            <!-- BUSCA -->

            <p align="center">
                <input
                    type="text"
                    id="search"
                    onkeyup="search()"
                    placeholder="Search music...">
            </p>

            <!-- PLAYLISTS -->

            <div id="playlistArea">

                <h3 align="center">My Playlists</h3>

                <p align="center">
                    <input
                        type="text"
                        id="playlistName"
                        placeholder="New Playlist">
                </p>

                <p align="center">
                    <button onclick="createPlaylist()">
                        Create Playlist
                    </button>
                </p>

                <ul id="playlistList"></ul>

            </div>

            <!-- RESULTADOS DA BUSCA -->

            <ul id="results"></ul>

        </main>

        <footer>

            <div class="control-box">

                <button id="repeatButton">
                    Repeat Off
                </button>

                <button onclick="prevSong()">
                    Prev
                </button>

                <button onclick="skipSong()">
                    Skip
                </button>

            </div>

            <p id="tituloMusica"></p>

            <audio
                id="audioPlayer"
                controls
                preload="auto"
                playsinline
                webkit-playsinline>

            </audio>

        </footer>

    </div>

    <script>

        var data = [];

        fetch('music_map.txt')
            .then(response => response.json())
            .then(json => {

                data = json;

                console.log(
                    "Músicas carregadas:",
                    data
                );

                renderList();
                playRandom();

            })
            .catch(error =>
                console.error(
                    "Erro:",
                    error
                )
            );

    </script>

    <!-- SCRIPT DO PLAYER -->
    <script src="js/script_hml.js"></script>

    <!-- SCRIPT DO PLAYER -->
    <script type="module" src="js/playlist-test.js"></script>

    <!-- LOGIN FIREBASE -->
    <script type="module" src="js/login-test.js"></script>

</body>

</html>
