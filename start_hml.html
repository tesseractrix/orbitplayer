<!DOCTYPE html>
<html lang="en">

<head>
    <title>Orbit Player</title>
    <link rel="icon" href="img/orbit_ico_blue.png">
    <link rel="stylesheet" href="css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <!-- ÁREA DE LOGIN -->

    <div id="login-area" style="text-align:center; margin-top:100px;">

        <img src="img/orbit_white.png" width="2202>

        <p>
            <input
                type="email"
                id="email"
                placeholder="Email">
        </p>

        <p>
            <input
                type="password"
                id="senha"
                placeholder="Senha">
        </p>

        <p>
            <button onclick="login()">Entrar</button>
        </p>

    </div>

    <!-- PLAYER -->

    <div id="player-area" style="display:none;">

        <header>

            <p>
                .html">
                    img/orbit_white.png140" height="50">
                </a>
            </p>

            <p>
                <a href="explore.html">Explore</a> •
                <a href="news.html">Updates</a>
            </p>

        </header>

        <main>

            <p align="center">
                <input
                    type="text"
                    id="search"
                    onkeyup="search()"
                    placeholder="Search music...">
            </p>

            <ul id="results"></ul>

        </main>

        <footer>

            <div class="control-box">
                <button id="repeatButton">Repeat Off</button>
                <button onclick="prevSong()">Prev</button>
                <button onclick="skipSong()">Skip</button>
            </div>

            <p id="tituloMusica"></p>

            <audio
                id="audioPlayer"
                controls
                preload="auto"
                playsinline
                webkit-playsinline>

                

            </audio>

        </footer>

    </div>

    <script>

        var data = [];

        fetch('music_map.txt')
            .then(response => response.json())
            .then(json => {

                data = json;

                console.log("Músicas carregadas:", data);

                renderList();
                playRandom();

            })
            .catch(error => console.error("Erro:", error));

    </script>

    .js"></script>

    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const firebaseConfig = {

            apiKey: "AIzaSyArSoUN8xIX7Cm-I4oQooyxK0diNjx2RyE",

            authDomain: "orbit-player-2b105.firebaseapp.com",

            projectId: "orbit-player-2b105",

            storageBucket: "orbit-player-2b105.firebasestorage.app",

            messagingSenderId: "1096650827222",

            appId: "1:1096650827222:web:5f812ce1961973d5c47077"

        };

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        window.login = async function () {

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    senha
                );

            } catch (erro) {

                alert("Email ou senha inválidos");

            }

        }

        onAuthStateChanged(auth, (user) => {

            if (user) {

                document.getElementById("login-area").style.display = "none";

                document.getElementById("player-area").style.display = "block";

            } else {

                document.getElementById("login-area").style.display = "block";

                document.getElementById("player-area").style.display = "none";

            }

        });

    </script>

</body>

</html>
