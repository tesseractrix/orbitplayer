<!DOCTYPE html>
<html lang="en">

<head>
    <title>Orbit Player | Cigarettes After Sex</title>

</head>

<body>

        </p>

        <p align="center">
            <input
                type="text"
                id="search"
                onkeyup="search()"
                placeholder="Search music in 100% Cigarettes...">
        </p>

    </main>

    <footer>

<script src="js/script.js"></script>

<script>
    var data = [];

    fetch('music_map.txt')
        .then(response => response.json())
        .then(json => {

            data = json.filter(track =>
                track.title.toLowerCase().includes('cigarettes after sex') ||
                track.title.toLowerCase().includes('cigatettes after sex')
            );

            console.log(
                `Playlist Cigarettes After Sex carregada (${data.length} músicas)`
